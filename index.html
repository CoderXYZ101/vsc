        <div class="field"><label>Current Master Password</label><input type="password" id="s_curPw"></div>
        <div class="field"><label>New Master Password</label><input type="password" id="s_newPw"></div>
        <button type="button" class="ghost" id="s_changePw" style="width:100%;">Change Master Password</button>
        <div class="err" id="s_pwErr"></div>
      </div>` : ''}

      <div class="set-group">
        <h4>Backup &amp; Restore</h4>
        <div class="row">
          <button type="button" class="ghost" id="s_export">Export Backup</button>
          <button type="button" class="ghost" id="s_import">Import Backup</button>
        </div>
        <input type="file" id="s_importFile" class="hidden" accept=".json">
      </div>

      <button id="s_save" style="width:100%;margin-top:10px;">Save Settings</button>
      <button class="ghost danger" id="s_logout" style="width:100%;margin-top:10px;">Sign Out</button>
    </div>`;

    document.getElementById('closeSet').onclick = ()=>modal.classList.add('hidden');
    if(VSC.currentUser.cloud){
      document.getElementById('s_changePw').onclick = async ()=>{
        const cur = document.getElementById('s_curPw').value;
        const nw = document.getElementById('s_newPw').value;
        const errEl = document.getElementById('s_pwErr');
        if(nw.length<8){ errEl.textContent='New password must be at least 8 characters.'; return; }
        try{
          const u = VSC.currentUser;
          const ok = await Crypto.verify(cur, u.master.salt, u.master.hash);
          if(!ok){ errEl.style.color='var(--danger)'; errEl.textContent='Current password is incorrect.'; return; }
          const newHash = await Crypto.hash(nw);
          await FBX.updateDoc(FBX.doc(FBX.db, 'vsc_users', u.username.toLowerCase(), 'private', 'security'), { master: newHash });
          u.master = newHash;
          Store.saveUser(u);
          errEl.style.color = 'var(--ok)';
          errEl.textContent = 'Password updated.';
        }catch(e){ errEl.style.color='var(--danger)'; errEl.textContent = friendlyFbError(e); }
      };
    }
    document.getElementById('s_export').onclick = ()=>{
      const blob = new Blob([Store.exportAll()], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'vsc-backup.json'; a.click();
    };
    document.getElementById('s_import').onclick = ()=>document.getElementById('s_importFile').click();
    document.getElementById('s_importFile').onchange = (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{ Store.importAll(reader.result); alert('Backup restored. Reloading...'); location.reload(); };
      reader.readAsText(f);
    };
    document.getElementById('s_logout').onclick = ()=>{
      Store.clearSession();
      location.reload();
    };
    document.getElementById('s_save').onclick = ()=>{
      const ns = {
        accent: document.getElementById('s_accent').value,
        blur: parseInt(document.getElementById('s_blur').value),
        alpha: parseFloat(document.getElementById('s_alpha').value),
        fontSize: parseInt(document.getElementById('s_font').value),
        swearFilter: document.getElementById('s_swear').checked,
        swearWords: document.getElementById('s_swearWords').value,
        panicPassword: document.getElementById('s_panicPw').value,
        panicHotkey: document.getElementById('s_hotkey').value.trim(),
        privacyMode: document.getElementById('s_privacy').checked,
        privacyReauth: document.getElementById('s_reauth').value,
        autoLockMin: parseInt(document.getElementById('s_autolock').value)||0,
        notifSound: document.getElementById('s_notif').checked
      };
      VSC.currentSettings = ns;
      Store.saveSettings(VSC.currentUser.username, ns);
      applyTheme(ns);
      PrivacyGuard.init(ns);
      if(!ns.swearFilter) document.getElementById('blackout').classList.remove('on');
      modal.classList.add('hidden');
    };
  }
};

VSC.onAuthenticated = function(username, isFake){
  const user = Store.getUser(username);
  VSC.currentUser = user;
  VSC.currentSettings = Store.getSettings(username);
  VSC.isFakeSession = isFake;
  VSC.universityMode = false;
  applyTheme(VSC.currentSettings);
  document.getElementById('authScreen').innerHTML = '';
  document.getElementById('authScreen').classList.add('hidden');
  if(isFake){
    FakeDash.mount();
  } else {
    ChatApp.mount(user);
    PrivacyGuard.init(VSC.currentSettings);
  }
};

// Public university cover session: physics hub only, no chat, no privacy guard.
VSC.openUniversityHub = function(){
  VSC.currentUser = null;
  VSC.currentSettings = Store.getSettings('university');
  VSC.isFakeSession = true;
  VSC.universityMode = true;
  applyTheme(VSC.currentSettings);
  document.getElementById('authScreen').innerHTML = '';
  document.getElementById('authScreen').classList.add('hidden');
  FakeDash.mount();
};

(function boot(){
  const db = Store.db();
  if(db.sessionUser && Store.getUser(db.sessionUser)){
    VSC.onAuthenticated(db.sessionUser, false);
  } else {
    AuthFlow.go('welcome');
  }
})();
</script>

<script type="module">
  if(window.__VSC_CFG_OK){
    try{
      const FBVER='https://www.gstatic.com/firebasejs/10.12.2/';
      const [appM, authM, fsM] = await Promise.all([
        import(FBVER+'firebase-app.js'),
        import(FBVER+'firebase-auth.js'),
        import(FBVER+'firebase-firestore.js')
      ]);
      const app = appM.initializeApp(window.firebaseConfig);
      const auth = authM.getAuth(app);
      let db;
      try{ db = fsM.initializeFirestore(app, {localCache: fsM.persistentLocalCache({tabManager: fsM.persistentMultipleTabManager()})}); }
      catch(e){ db = fsM.getFirestore(app); }
      window.FBX = {
        auth, db,
        signInAnonymously: authM.signInAnonymously,
        onAuthStateChanged: authM.onAuthStateChanged,
        doc: fsM.doc, getDoc: fsM.getDoc, setDoc: fsM.setDoc, updateDoc: fsM.updateDoc,
        collection: fsM.collection, onSnapshot: fsM.onSnapshot, getDocs: fsM.getDocs,
        query: fsM.query, where: fsM.where, orderBy: fsM.orderBy, limit: fsM.limit,
        addDoc: fsM.addDoc, serverTimestamp: fsM.serverTimestamp,
        arrayUnion: fsM.arrayUnion, arrayRemove: fsM.arrayRemove
      };
      await new Promise((resolve, reject)=>{
        authM.onAuthStateChanged(auth, user=>{ if(user) resolve(); }, reject);
        authM.signInAnonymously(auth).catch(reject);
      });
      window.__VSC_FB_READY = true;
      if(window.onFirebaseReady) window.onFirebaseReady();
    }catch(e){ console.error('VSC Firebase init failed', e); window.__VSC_FB_ERROR = e; }
  }
</script>
